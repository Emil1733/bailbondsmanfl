name: Production smoke monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run non-writing production checks
        run: node scripts/smoke-production.mjs

      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create automated-monitoring --color B60205 --description "Automated production monitoring failure" --force
          issue_number=$(gh issue list --label automated-monitoring --state open --json number --jq '.[0].number')
          message="Production smoke monitoring failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review: $RUN_URL"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$message"
          else
            gh issue create --title "Production monitoring failure" --label automated-monitoring --body "$message"
          fi
